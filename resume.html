<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vu Minh Phuc — Resume</title>
<style>
  :root { --ink:#1a1a1a; --body:#333; --mute:#666; --hairline:#ddd; --canvas:#fff; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:var(--canvas);line-height:1.45;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .page{max-width:760px;margin:0 auto;padding:32px 36px 24px}
  .header{text-align:center;border-bottom:1.5px solid var(--ink);padding-bottom:12px;margin-bottom:12px}
  .header-name{font-size:22px;font-weight:700;letter-spacing:0.01em}
  .header-headline{font-size:11px;color:var(--body);margin-top:2px}
  .header-contacts{margin-top:6px;font-size:9px;color:var(--mute)}
  .header-contacts a{color:var(--mute);text-decoration:none}
  .section{margin-bottom:11px}
  .section-title{font-family:Arial,Helvetica,sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--hairline);padding-bottom:3px;margin-bottom:7px}
  .summary-text{font-size:10px;color:var(--body);line-height:1.55}
  .skill-line{font-size:9.5px;color:var(--body);line-height:1.6}
  .skill-line strong{font-family:Arial,Helvetica,sans-serif;font-size:9px}
  .exp-item{margin-bottom:9px}
  .exp-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .exp-role{font-size:11px;font-weight:700}
  .exp-company{font-size:10px;color:var(--mute)}
  .exp-period{font-family:Arial,Helvetica,sans-serif;font-size:8.5px;color:var(--mute);white-space:nowrap}
  .exp-bullets{margin-top:3px;padding-left:15px}
  .exp-bullets li{font-size:9.5px;color:var(--body);line-height:1.5;margin-bottom:2px}
  .proj-item{margin-bottom:7px}
  .proj-name{font-size:10px;font-weight:700}
  .proj-meta{font-family:Arial,Helvetica,sans-serif;font-size:8px;color:var(--mute)}
  .proj-desc{font-size:9.5px;color:var(--body);line-height:1.5}
  .proj-tags{font-family:Arial,Helvetica,sans-serif;font-size:8px;color:var(--mute)}
  .edu-line{font-size:9.5px;color:var(--body);line-height:1.55}
  @media print{body{padding:0}.page{padding:24px 28px 16px;max-width:none}a{color:var(--mute)!important}}
  @page{size:A4;margin:0}
</style>
</head>
<body>
<div class="page" id="resume-root">
  <div class="header">
    <div class="header-name" id="r-name"></div>
    <div class="header-headline" id="r-headline"></div>
    <div class="header-contacts" id="r-contacts"></div>
  </div>
  <div class="section"><div class="section-title">Summary</div><p class="summary-text" id="r-summary"></p></div>
  <div class="section"><div class="section-title">Skills</div><div id="r-skills"></div></div>
  <div class="section"><div class="section-title">Experience</div><div id="r-exp"></div></div>
  <div class="section"><div class="section-title">Projects</div><div id="r-projects"></div></div>
  <div class="section"><div class="section-title">Education</div><div id="r-edu"></div></div>
</div>
<script>
(async()=>{
  try{
    const d=await (await fetch('data.json')).json();
    const r=d.resume, p=d.person;
    document.getElementById('r-name').textContent=p.name+' — '+p.alias;
    document.getElementById('r-headline').textContent=p.headline+' · '+p.location;
    document.getElementById('r-contacts').innerHTML=[
      `<a href="mailto:${p.email}">${p.email}</a>`,
      `<a href="${r.portfolioUrl}">portfolio</a>`,
      `<a href="${p.github}">github</a>`,
      `<a href="${p.linkedin}">linkedin</a>`,
      p.aptisUrl?`<a href="${p.aptisUrl}">English B2 (APTIS)</a>`:''
    ].filter(Boolean).join(' · ');
    document.getElementById('r-summary').textContent=r.summary;
    document.getElementById('r-skills').innerHTML=r.skillLines.map(l=>{
      const i=l.indexOf(':');
      return `<div class="skill-line"><strong>${l.slice(0,i)}</strong>${l.slice(i)}</div>`;
    }).join('');
    document.getElementById('r-exp').innerHTML=r.experience.map(e=>`<div class="exp-item"><div class="exp-head"><div><span class="exp-role">${e.role}</span> <span class="exp-company">— ${e.company}</span></div><div class="exp-period">${e.period}</div></div><ul class="exp-bullets">${e.bullets.map(b=>`<li>${b}</li>`).join('')}</ul></div>`).join('');
    document.getElementById('r-projects').innerHTML=r.selectedProjects.map(p=>`<div class="proj-item"><span class="proj-name">${p.name}</span> <span class="proj-meta">· ${p.meta}</span><div class="proj-desc">${p.desc}</div><div class="proj-tags">${p.tags.join(' · ')}</div></div>`).join('');
    const edu=d.education[0], certs=d.certifications.map(c=>`${c.name} — ${c.issuer}`).join('; ');
    document.getElementById('r-edu').innerHTML=`<div class="edu-line"><strong>${edu.degree}</strong>, ${edu.school} (${edu.period})</div><div class="edu-line" style="color:var(--mute)">Certifications: ${certs}</div>`;
    document.documentElement.dataset.resumeReady='true';
  }catch(e){console.error(e);document.documentElement.dataset.resumeReady='error'}
})();
</script>
</body>
</html>
