name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild weekly so the GitHub-activity section stays fresh.
  # Sunday 03:17 UTC — deliberately off the top of the hour.
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci || npm install
      - name: Generate GitHub activity data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: node scripts/fetch-github-activity.mjs
      - name: Validate data
        run: node scripts/generate-resume.mjs --check
      - name: Generate resume PDF
        run: node scripts/generate-resume.mjs
      - uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
